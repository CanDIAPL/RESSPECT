image:
  repository: resspect-daily
  tag: dev
  pullPolicy: Never

initImage:
  pullPolicy: Never

schedule: "0 12 * * *"
timeZone: America/Los_Angeles
suspend: true
dryRun: true

fastdb:
  profile: local-kind-cronjob

#for local testing overwrite the realtime processing version with simulated "lass" data
#and set the mjdNow date to something close to the simulated data
analysis:
  processingVersion: lass
  requester: resspect-local
  mjdNow: 10.0
